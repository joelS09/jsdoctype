<style>
:root{--ac:#a3e635;--ac2:color-mix(in srgb,var(--ac) 76%,#000);--on:#0a1204;--bg:#050705;--pn:color-mix(in srgb,var(--bg) 91%,#fff);--pn2:color-mix(in srgb,var(--bg) 86%,#fff);--ln:rgba(255,255,255,.09);--lna:color-mix(in srgb,var(--ac) 40%,transparent);--tx:#f1f3ee;--mu:#9aa595;--r:22px;--ease:cubic-bezier(.16,.84,.24,1);--disp:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--serif:var(--disp);--lh:0deg;--gbase:linear-gradient(135deg,var(--ac),var(--ac2));--gbtn:var(--gbase);--gtxt:var(--gbase);--glogo:var(--gbase);--gdet:var(--gbase);--gpro:var(--gbase);--hc1:var(--ac);--hc2:var(--ac2)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .6s}
a{text-decoration:none;color:inherit}button{font-family:inherit}img{max-width:100%}
.wrap{width:min(1160px,100% - 40px);margin:auto}
h1,h2,h3,h4,h5,.pr,.br{font-family:var(--disp);letter-spacing:-.025em}
.hl{color:var(--ac);font-family:inherit;font-style:normal;font-weight:inherit;display:block}
.ln .hl,.gbox .hl{display:inline}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* fondo */
#fx{position:fixed;inset:0;z-index:-2;width:100%;height:100%;pointer-events:none}
.aur{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aur i{position:absolute;border-radius:50%;opacity:.26;background:radial-gradient(circle,var(--ac) 0,transparent 68%);will-change:transform}
.aur i:nth-child(1){width:55vmax;height:55vmax;right:-22vmax;top:-12vmax;animation:dr1 22s ease-in-out infinite alternate}
.aur i:nth-child(2){width:42vmax;height:42vmax;left:-20vmax;top:55vh;opacity:.15;animation:dr2 28s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(-8vmax,10vmax) scale(1.15)}}@keyframes dr2{to{transform:translate(12vmax,-8vmax) scale(.9)}}
#glow{display:none;position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(480px circle at var(--gx,70%) var(--gy,20%),color-mix(in srgb,var(--ac) 12%,transparent),transparent 65%)}
html.fx body:after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left;z-index:120;box-shadow:0 0 12px var(--ac)}
/* botones */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:9px;background:var(--gbtn);color:var(--on);font-weight:600;font-size:.92rem;padding:14px 26px;border-radius:99px;border:0;cursor:pointer;transition:box-shadow .3s,filter .3s}
.btn:hover{box-shadow:0 12px 34px -10px var(--ac)}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover:after{left:130%}
.btn .i{transition:transform .3s}.btn:hover .i{transform:translateX(4px)}
.btn.s{padding:10px 20px;font-size:.84rem}
.btn.light{background:#f4f1ea;color:#0a0a08;box-shadow:0 10px 40px -14px rgba(255,255,255,.5)}
.btn.light:hover{background:var(--ac);color:var(--on)}
.btn.off{opacity:.5}
/* menú */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;width:min(1060px,100% - 28px);border:1px solid var(--ln);border-radius:99px;background:color-mix(in srgb,var(--bg) 92%,transparent);box-shadow:0 18px 50px -22px #000,inset 0 1px 0 rgba(255,255,255,.06);transition:transform .5s var(--ease)}
.nav.hide{transform:translate(-50%,-140%)}
.nav .in{height:56px;padding:0 8px 0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.br{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;letter-spacing:.06em}
.br img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.nav ul{list-style:none;display:flex;gap:2px;flex:1;justify-content:center}
.nav ul a{position:relative;display:block;padding:8px 14px;font-size:.86rem;font-weight:500;color:var(--mu);transition:color .2s}
.nav ul a:after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:1.5px;background:var(--ac);transform:scaleX(0);transition:transform .35s var(--ease)}
.nav ul a:hover,.nav ul a.on{color:#fff}.nav ul a.on:after,.nav ul a:hover:after{transform:scaleX(1)}
/* hero */
#inicio{position:relative;min-height:100svh;display:flex;align-items:center;padding:118px 0 40px}
.hg{display:grid;grid-template-columns:1.02fr .98fr;gap:30px;align-items:center}
.tagl{display:inline-flex;align-items:center;gap:10px;font-family:var(--disp);font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);padding:8px 16px;border:1px solid var(--lna);border-radius:99px;background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tagl:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.lead h1{font-size:clamp(2.5rem,6vw,5.2rem);font-weight:700;line-height:1;letter-spacing:-.04em;margin:22px 0 0}
.lead h1 .ln{display:block;overflow:hidden;padding:.05em .1em .16em;margin:0 -.1em}
.lead h1 .ln>span{display:block;transform:translateY(112%) rotate(3deg);transform-origin:left;transition:transform 1.1s var(--ease) calc(.2s + var(--k,0)*.15s)}
.lead.in h1 .ln>span{transform:none}

.sub{color:var(--mu);font-size:clamp(1rem,1.5vw,1.14rem);max-width:540px;margin-top:20px;white-space:pre-line}
.cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:30px}
.note{display:block;margin-top:16px;font-size:.8rem;color:var(--mu)}
.vis{position:relative;perspective:1100px}
.lgw{position:relative;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s var(--ease);transform-style:preserve-3d;animation:flt 7s ease-in-out infinite}
@keyframes flt{50%{translate:0 -14px}}
.lgw img{display:block;width:100%;height:auto;filter:hue-rotate(var(--lh)) saturate(var(--ls,1));-webkit-mask-image:radial-gradient(ellipse 62% 66% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 62% 66% at 50% 50%,#000 55%,transparent 100%)}
.lgw img.b{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.vis[data-logo="neon"] .lgw img.b{opacity:1}
.vis[data-logo="neon"] .lgw img.a{opacity:0}
.lgw img.a{transition:opacity .6s}
.orb{position:absolute;inset:8% 6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 30%,transparent),transparent 65%);z-index:-1;animation:pu 5s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.15);opacity:.7}}
.scr{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mu)}
.scr i{width:1px;height:34px;background:linear-gradient(var(--ac),transparent);animation:sc 2s ease-in-out infinite;transform-origin:top}
@keyframes sc{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
#trg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:46px}
#trg .it{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:18px;border:1px solid var(--ln);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--pn)}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--lna);background:color-mix(in srgb,var(--ac) 9%,transparent);color:var(--ac);font-size:1.15rem;flex:none;transition:transform .4s var(--ease),background .3s}
.it:hover .ic,.cd:hover .ic{transform:translateY(-2px) rotate(-8deg);background:color-mix(in srgb,var(--ac) 18%,transparent)}
#trg h3{font-size:.95rem;font-weight:600;line-height:1.25}#trg p{font-size:.8rem;color:var(--mu);margin-top:3px;line-height:1.45}
/* marquesina */
.mq{overflow:hidden;border-block:1px solid var(--ln);padding:20px 0;margin-top:30px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq div{display:flex;gap:38px;width:max-content;animation:mq 38s linear infinite;font-family:var(--serif);font-style:normal;font-size:clamp(1.5rem,3.4vw,2.6rem);font-weight:600;letter-spacing:-.02em;color:#e9e6dd;white-space:nowrap}
.mq span:nth-child(even){color:var(--ac);font-style:normal;font-size:.55em;align-self:center}
@keyframes mq{to{transform:translateX(-50%)}}
/* secciones */
.sec{padding:96px 0 8px}
.sh{text-align:center;margin-bottom:40px}
.ey{display:inline-flex;align-items:center;gap:10px;font-family:var(--disp);font-size:.7rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.ey:before,.ey:after{content:"✦";font-size:.6rem}
.sh h2{font-size:clamp(2rem,4.8vw,3.5rem);font-weight:600;line-height:1.05;white-space:pre-line}

.sh p{color:var(--mu);max-width:640px;margin:14px auto 0;white-space:pre-line}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease) var(--d,0s),transform .9s var(--ease) var(--d,0s)}
.rv.in{opacity:1;transform:none}
html.fx .rv{filter:blur(8px);transition:opacity 1s var(--ease) var(--d,0s),transform 1.1s var(--ease) var(--d,0s),filter 1s var(--ease) var(--d,0s)}
html.fx .rv.in{filter:none}
html.fx #glow{display:block}
/* tarjetas */
.cds{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));text-align:left}
.cd,.wk,.stage,.gbox,.promo,.fq,.ct,.tab{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008)),var(--pn);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 26px 50px -36px #000}
.cd{position:relative;overflow:hidden;padding:26px;border-radius:var(--r);border:1px solid var(--ln);transition:border-color .3s}
.cd:hover,.wk:hover{border-color:var(--lna)}
.sp:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac) 16%,transparent),transparent 60%)}
.sp:hover:before{opacity:1}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s var(--ease),border-color .3s}
.cd .no{position:absolute;right:20px;top:10px;font-family:var(--serif);font-style:normal;font-size:3.4rem;line-height:1;color:rgba(255,255,255,.07)}
.cd h3{font-size:1.28rem;font-weight:600;margin:18px 0 8px;position:relative;line-height:1.15}.cd p{font-size:.93rem;color:var(--mu);position:relative}.cd .ic{position:relative}
/* planes */
.pl{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;align-items:center}
.stage{position:relative;border-radius:26px;border:1px solid var(--ln);overflow:hidden;box-shadow:0 40px 80px -46px color-mix(in srgb,var(--ac) 55%,transparent)}
.stage .bar{display:flex;align-items:center;gap:6px;padding:11px 14px;border-bottom:1px solid var(--ln);background:var(--pn2);position:relative;z-index:2}
.stage .bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.stage .bar span{margin-left:10px;font-size:.7rem;color:var(--mu);letter-spacing:.04em}
.slw{position:relative;aspect-ratio:16/10;background:#06080a}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.05);transition:opacity .7s var(--ease),transform 1.2s var(--ease);pointer-events:none}
.sl.on{opacity:1;transform:none}
.sl img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sl.fit img{object-fit:contain;object-position:center}
.pinf{display:grid;overflow-x:clip}
.pi{grid-area:1/1;opacity:0;transform:translateX(22px);transition:opacity .5s var(--ease),transform .6s var(--ease);pointer-events:none;visibility:hidden}
.pi.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:.12s}
.bd{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);border:1px solid var(--lna);padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.03)}
.pi h3{font-size:clamp(2rem,4vw,3rem);font-weight:600;margin:16px 0 6px;white-space:pre-line;line-height:1.05}
.pr{font-size:clamp(3rem,6vw,4.4rem);font-weight:700;color:var(--ac);line-height:1;text-shadow:0 0 40px color-mix(in srgb,var(--ac) 40%,transparent)}
.pi p{color:var(--mu);margin:14px 0 24px;font-size:.98rem;white-space:pre-line}
.nv{display:flex;gap:8px;margin-top:24px;align-items:center;color:var(--mu);font-size:.8rem}
.nv button{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--tx);cursor:pointer;display:grid;place-items:center;transition:.25s}
.nv button:hover{border-color:var(--lna);color:var(--ac)}
.cnt{margin-left:8px;font-family:var(--disp);letter-spacing:.12em}
.ptabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:28px}
.tab{position:relative;overflow:hidden;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--ln);color:var(--tx);cursor:pointer;transition:border-color .3s,transform .3s var(--ease)}
.tab:hover{transform:translateY(-3px)}
.tab small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.tab b{display:flex;justify-content:space-between;gap:8px;font-family:var(--disp);font-weight:600;font-size:.98rem;margin-top:3px}.tab b span{color:var(--ac)}
.tab.on{border-color:var(--lna)}
.tab .pg{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left}
.tab.on .pg{transform:scaleX(1)}
.auto .tab.on .pg{transform:scaleX(0);animation:fill 7s linear forwards}
#plw:hover .pg,#plw.off .pg{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
/* proceso */
.stp{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stp:before{content:"";position:absolute;left:14%;right:14%;top:49px;height:1px;background:linear-gradient(90deg,var(--ac),var(--lna));transform:scaleX(0);transform-origin:left;transition:transform 1.6s var(--ease) .3s}
.stp.in:before{transform:scaleX(1)}
.stp .cd{text-align:center;padding:28px 22px}
.stp .n{display:grid;place-items:center;width:44px;height:44px;margin:0 auto;border-radius:50%;background:var(--ac);color:var(--on);font-family:var(--disp);font-weight:700;position:relative;box-shadow:0 0 0 7px var(--bg),0 0 26px -4px var(--ac)}
/* trabajos */
.wks{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.wk{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);cursor:zoom-in;display:flex;flex-direction:column;text-align:left}
.wk .im{overflow:hidden;background:#06080a;aspect-ratio:16/10;display:grid;place-items:center}
.wk img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .9s var(--ease)}
.wk:hover img{transform:scale(1.05)}
.wk .bd2{padding:18px 20px 20px;position:relative}
.wk h4{font-size:1.25rem;font-weight:600}.wk p{font-size:.9rem;color:var(--mu);margin-top:4px}
.wk .lk{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.84rem;font-weight:600;color:var(--ac)}
.lb{position:fixed;inset:0;background:rgba(3,5,3,.94);z-index:130;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:10px;text-align:center}
.lb.on{display:flex;animation:fd .3s}@keyframes fd{from{opacity:0}}
.lb img{max-width:100%;max-height:74vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb h3{font-size:1.3rem}.lb p{color:var(--mu);max-width:640px}
.lb button{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;cursor:pointer}
/* garantía */
.gbox{position:relative;overflow:hidden;display:flex;align-items:center;gap:30px;padding:36px 38px;border-radius:28px;border:1px solid var(--ln);background:linear-gradient(120deg,var(--pn),color-mix(in srgb,var(--ac) 10%,var(--pn)))}
.gem{display:grid;place-items:center;flex:none;width:84px;height:84px;border-radius:50%;border:1px solid var(--lna);color:var(--ac);font-size:2.2rem;background:color-mix(in srgb,var(--ac) 9%,transparent);animation:pl 3.4s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 32%,transparent)}50%{box-shadow:0 0 0 16px transparent}}
.gbox h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:600;line-height:1.1;white-space:pre-line}
.gbox p{margin:12px 0 20px;color:var(--mu);white-space:pre-line}
/* oferta */
.promo{--pa:var(--ac);position:relative;overflow:hidden;padding:46px 44px;border-radius:30px;border:1px solid var(--lna);background:radial-gradient(520px 280px at 95% 50%,color-mix(in srgb,var(--pa) 22%,transparent),transparent 70%),var(--pn)}
.promo>div{position:relative;max-width:620px}
.promo h5{font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.promo h5:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);animation:bl 1.6s infinite}
.promo h2{font-size:clamp(1.8rem,3.8vw,2.8rem);font-weight:600;line-height:1.05;margin-bottom:12px;white-space:pre-line}
